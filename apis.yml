aid: miro
url: https://raw.githubusercontent.com/api-evangelist/miro/refs/heads/main/apis.yml
name: Miro
kind: company
description: >-
  Miro is an online collaborative whiteboard used by distributed teams for brainstorming, diagramming, and workshops.
  The Miro REST API exposes boards, board items (sticky notes, cards, shapes, frames, images, embeds, etc.), connectors,
  tags, mind maps, members, organizations, teams, webhooks, audit logs, and SCIM provisioning. Miro also offers a Web
  SDK for in-board apps.
accessModel:
  pricing: freemium
  onboarding: self-serve
  trial: false
  try_now: true
  public: false
  label: Freemium · Self-serve signup
  confidence: high
